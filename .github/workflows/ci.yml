name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Always runs. A green badge here is STATIC ONLY — never treat as DB PASS.
  # -------------------------------------------------------------------------
  static-quality:
    name: Static · lint · typecheck · unit · build · security(static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SECURITY_CHECK_ALLOW_SKIP_DB: "1"
      SECURITY_CHECK_STATIC_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Static security check
        run: npm run security:check

      - name: Dependency audit
        run: npm audit --audit-level=high

  # -------------------------------------------------------------------------
  # Live staging DB/RLS/RPC — trusted same-repo contexts only.
  # Never use secrets in job-level `if` (GitHub rejects that).
  # Fork PRs: this job is SKIPPED / NOT RUN (neutral).
  # Same-repo push/PR without SUPABASE_DB_URL: FAIL with clear preflight.
  # -------------------------------------------------------------------------
  db-security:
    name: DB · RLS/RPC security suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Promote secret presence to env (allowed); do NOT use secrets.* in `if`.
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SECURITY_CHECK_ALLOW_SKIP_DB: "0"
      SECURITY_CHECK_STATIC_ONLY: "0"
    steps:
      - name: Preflight staging DB credentials
        run: |
          if [ "${HAS_SUPABASE_DB_URL}" != "true" ]; then
            echo "::error::SUPABASE_DB_URL repository secret is not configured."
            echo "DB/RLS/RPC security suite cannot run without staging credentials."
            echo "Static-quality may still be green — that is NOT a DB security PASS."
            exit 1
          fi
          echo "SUPABASE_DB_URL is configured for trusted same-repo context."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: DB security check (static + live staging DB)
        run: npm run security:check

      - name: DB / RLS / RPC tests
        run: npm run db:test
